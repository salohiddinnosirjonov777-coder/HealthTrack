<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parolni o'zgartirish - HealthTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <canvas id="bg3d-canvas"></canvas>
  <div class="wrap">
    <div class="topbar"></div>

    <div class="card auth-card">
      <h1 class="title">Parolni o'zgartirish</h1>
      <p class="lede" style="text-align:center;">Xavfsizlik uchun kuchli va boshqa joyda ishlatilmagan parol tanlang.</p>
      <ul class="errorlist" id="form-errors" style="display:none;"></ul>
      <form id="pw-form">
        <input type="password" id="old_password" placeholder="Eski parol" autocomplete="current-password" required>
        <input type="password" id="new_password1" placeholder="Yangi parol" autocomplete="new-password" required>
        <input type="password" id="new_password2" placeholder="Yangi parolni tasdiqlang" autocomplete="new-password" required>
        <button class="btn btn-block" type="submit">Parolni yangilash</button>
      </form>
      <p class="muted-link"><a href="profile.html">← Profilga qaytish</a></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/bg3d.js?v=2"></script>
  <script src="js/app.js"></script>
  <script>
    initPage({ requireAuth: true });

    document.getElementById("pw-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const result = changePassword(
        document.getElementById("old_password").value,
        document.getElementById("new_password1").value,
        document.getElementById("new_password2").value
      );
      const errBox = document.getElementById("form-errors");
      if (result.ok) {
        window.location.href = "password_change_done.html";
      } else {
        errBox.style.display = "block";
        errBox.innerHTML = result.errors.map((e) => `<li>${escapeHtml(e)}</li>`).join("");
      }
    });
  </script>
  <script src="js/tilt.js?v=2"></script>
</body>
</html>
